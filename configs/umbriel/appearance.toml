[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 10
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2

[colors]
background = "#0f1516FF"
text_primary = "#dee3e5FF"
text_muted = "#bfc8caFF"
accent_primary = "#82d3e2FF"
accent_secondary = "#b1cbd0FF"
warning = "#bbc5eaFF"
error = "#ffb4abFF"
insert_hint = "#bbc5ea80"
backdrop = "#323b3dFF"
shadow = "#0000007F"

[colors.border]
focused = "#82d3e2FF"
unfocused = "#323b3dFF"
scratchpad_focused = "#bbc5eaFF"
scratchpad_unfocused = "#3c4665FF"
outer = "#000000FF"

[colors.overview]
background_tint = "#00000088"
workspace_background = "#00000044"
badge = "#7AA3FFFF"
