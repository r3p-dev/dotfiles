[include]
files = ["keybinds.toml"]

[general]
autostart = ["noctalia", "kitty"]
mod_key = "Super"
show_cheatsheet = false
focus_on_activate = true

[screencast]
disable_dynamic_confirmation = false

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 10
drag_opacity = 0.75
opaque_fullscreen = true

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2

[colors]
background = "#0f1516FF"
text_primary = "#dee3e5FF"
text_muted = "#bfc8caFF"
accent_primary = "#82d3e2FF"
accent_secondary = "#b1cbd0FF"
warning = "#bbc5eaFF"
error = "#ffb4abFF"
insert_hint = "#bbc5ea80"
backdrop = "#323b3dFF"
shadow = "#0000007F"

[colors.border]
focused = "#82d3e2FF"
unfocused = "#323b3dFF"
outer = "#000000FF"

[colors.overview]
background_tint = "#00000088"
workspace_background = "#00000044"
badge = "#7AA3FFFF"

[animation]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.windows_in]
enabled = true
curve = "spring:1,900"
style = "popin"
scale = 0.5

[animation.windows_out]
enabled = true
curve = "spring:1,1400"
style = "popin"
scale = 0.8

[animation.windows_move]
enabled = true
curve = "spring:1,900"

[animation.workspaces]
enabled = true
curve = "spring:1,800"

[animation.overview]
enabled = true
curve = "spring:1,800"
workspace_curve = "spring:1,1000"

[animation.scratchpad]
enabled = true
curve = "spring:1,800"
dim = 0.8
blur = false
scale = 0.0
maximize = false
fullscreen = false

[animation.border]
enabled = true
curve = "spring:1,900"

[animation.dim_unfocused]
enabled = false
dim = 0.0

[animation.layers]
enabled = false

# ==============================================================================
# Effects
# Every effect is off until a preset is selected; border and window effects
# scale with overview zoom. Include a bundled preset (adjust /usr for the
# package prefix), then select it by name.
# https://docs.noctalia.dev/umbriel/effects/
# [include]
# files = ["/usr/share/umbriel/effects/border/pulse/effect.toml"]
# Pools accept matching presets defined/included separately. This one-member
# example uses the bundled pulse preset; add other border names to choose.
# [effects.pool.borders]
# kind = "border"
# choose = ["pulse"]
# selection = "unused_first" # or round_robin, random
# Select with border = "borders" in your [effects] table.
# Add to your existing [keybinds] table:
# "Mod+Shift+E" = "effect-border-cycle:borders"
# "Mod+Ctrl+E" = "effect-border-toggle"
# "Mod+Alt+E" = "effect-border-reset"

# [effects]
# border = "pulse"

[input]
middle_click_paste = true
client_window_drag = true
window_drag_toggle = "none"

[input.keyboard]
layout = ""
variant = ""
options = ""
repeat_rate = 25
repeat_delay = 600
numlock_toggle = true
track_layout = "global"

[input.touchpad]
tap = true
natural_scroll = true
accel_profile = "flat"
sensitivity = 0.0
scroll_factor = 1.0
disable_while_typing = true
disable_on_external_mouse = false

[input.mouse]
natural_scroll = false
accel_profile = "flat"
sensitivity = 0.0
scroll_wheel_step = 60

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 0.5

[input.cursor]
theme = ""
size = 24
hardware_cursor = true
follows_focus = true
hide_when_typing = false
hide_timeout_ms = 0

[layout]
mode = "scrolling"
gap = 8
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = false
center_focused = "never"

[layout.struts]
left = 0
right = 0
top = 0
bottom = 0

[layout.master]
position = "left"
default_width_fraction = 0.55
new_on_top = true
new_becomes_master = false

[[window_rule]]
blur = true
blur_optimized = true

[[window_rule]]
match.is_alone = true
default_maximize = true

[[window_rule]]
match.is_focused = false
opacity = 0.85

[[window_rule]]
match.is_focused = true
opacity = 1.0

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#bbc5eaFF"
border_color_unfocused = "#3c4665FF"

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

[overview]
zoom = 0.5
scroll_factor_horizontal = 1.0
scroll_factor_vertical = 1.0
background_blur = true
workspace_wallpaper = true
shortcuts = true
shortcut_keys = "1234567890"

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

[hot_corners.top_right]
enabled = true
delay_ms = 500
action = "overview-close"

[workspaces]
back_and_forth = true
empty_above = false

[include.optional]
files = ["noctalia.toml"]
