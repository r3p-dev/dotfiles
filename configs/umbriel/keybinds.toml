[keybinds]

# ──────────────────────────── Applications & Session ────────────────────────
"Mod+Return" = "spawn:kitty"
"Mod+B" = "spawn:brave-origin"
"Mod+I" = "spawn:firefox"
"Mod+K" = "spawn:code"
"Mod+Y" = "spawn:kitty -e yazi"
"Mod+N" = "spawn:nautilus"

"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+Z" = "spawn:noctalia msg panel-toggle launcher /emo"
"Mod+Ctrl+N" = "spawn:noctalia msg panel-toggle control-center"
"Mod+X" = "spawn:noctalia msg panel-toggle noctalia/notes:panel"
"Alt+F4" = "spawn:noctalia msg panel-toggle session"
"Print" = "spawn:noctalia msg plugin alexander/screen-toolkit:service all toggle"
"Mod+Shift+Z" = "cheatsheet-toggle"

"Mod+Q" = "window-close"

# ──────────────────────────── Window Navigation ─────────────────────────────
"Mod+Left" = "window-focus-or-output-left"
"Mod+Down" = "window-focus-or-output-down"
"Mod+Up" = "window-focus-or-output-up"
"Mod+Right" = "window-focus-or-output-right"

"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"

"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "column-move-left"
"Mod+Shift+WheelDown" = "column-move-right"

# ─────────────────────────── Window State & Layout ──────────────────────────
"Mod+T" = "window-toggle-floating"
"Mod+Shift+T" = "window-focus-switch-floating"
"Mod+P" = "window-toggle-pinned"

"Mod+M" = "window-toggle-maximize-to-edges"
"Mod+F" = "window-toggle-maximize"

"Mod+C" = "column-center"
"Mod+Shift+C" = "window-center"

# ──────────────────────────────── Overview ──────────────────────────────────
"Mod+O" = { action = "overview-toggle", repeat = false }

# ─────────────────────────── Window Size & Resize ───────────────────────────
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Alt+R" = "window-cycle-secondary-extent"
"Mod+Alt+Shift+R" = "window-cycle-secondary-extent-back"

"Mod+Minus" = "window-modify-primary-extent:-0.1"
"Mod+Equal" = "window-modify-primary-extent:0.1"
"Mod+Alt+Minus" = "window-modify-secondary-extent:-0.1"
"Mod+Alt+Equal" = "window-modify-secondary-extent:0.1"

# ───────────────────────────── Window Consume / Expel ───────────────────────
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+BackSpace" = "window-consume-or-expel-left"

# ───────────────────────────── Workspace Navigation ─────────────────────────
"Mod+Page_Up" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"
"Mod+Ctrl+WheelUp" = "workspace-previous"
"Mod+Ctrl+WheelDown" = "workspace-next"

"Mod+Shift+Page_Up" = "window-move-to-workspace-previous"
"Mod+Shift+Page_Down" = "window-move-to-workspace-next"
"Mod+Ctrl+Shift+WheelUp" = "window-move-to-workspace-previous"
"Mod+Ctrl+Shift+WheelDown" = "window-move-to-workspace-next"

"Alt+Tab" = "workspace-focus-last"

# ───────────────────────────────── Scratchpads ──────────────────────────────
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"

# ────────────────────────────── Audio Controls ──────────────────────────────
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true }
"XF86AudioPlay" = "spawn:noctalia msg media toggle"
"XF86AudioNext" = "spawn:noctalia msg media next"
"XF86AudioPrev" = "spawn:noctalia msg media previous"
"XF86AudioStop" = "spawn:noctalia msg media stop"

# ─────────────────────────────── Display Brightness ─────────────────────────
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down 10", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up 10", allow_when_locked = true }