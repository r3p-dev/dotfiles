[audio]
enable_overdrive = true

[bar.default]
center = [ "privacy", "notes", "clock", "notifications" ]
end = [ "tray", "clipboard", "network", "volume", "battery", "session" ]
margin_ends = 0
start = [ "control-center", "workspaces", "media", "recorder" ]

[[control_center.shortcuts]]
type = "clipboard"

[[control_center.shortcuts]]
type = "wallpaper"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[hot_corners]
enabled = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
layer = "overlay"
position = "bottom_center"

[osd]
position = "bottom_center"

[plugins]
enabled = [
    "noctalia/kaomoji",
    "noctalia/notes",
    "noctalia/screen_recorder",
    "yuuto/arch-updater",
    "8bury/mini-docker",
    "ahmedhossamdev/sticky-notes"
]

[shell]
lang = "en"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.animation]
    enabled = false

    [shell.launcher]
    sort_by_usage = false

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true
    remember_last_region = true
    save_to_file = false
    show_cursor = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "destructive"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "kitty", "umbriel" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition = []

    [wallpaper.default]
    path = "/home/r3p/Pictures/Wallpapers/wallhaven.png"

[widget.battery]
hide_when_plugged = true

[widget.media]
hide_album_art = true
hide_artist = true
hide_when_no_media = true
show_progress = true

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.privacy]
hide_inactive = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.volume]
show_label = false
