[audio]
enable_overdrive = true

[bar.default]
start = ["clock", "notifications", "media"]
center = ["workspaces", "privacy"]
end = ["tray", "network", "volume", "battery"]
margin_ends = 350
font_weight = 700

[[control_center.shortcuts]]
type = "8bury/lid-guard:lid-guard-toggle"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "wallpaper"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[hot_corners]
enabled = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
layer = "overlay"
position = "bottom_center"
offset_y = 20

[osd]
position = "bottom_center"
offset_y = 20

[plugins]
enabled = [
    "noctalia/notes",
    "alexander/screen-toolkit",
    "8bury/lid-guard",
]

[shell]
lang = "en"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.animation]
    enabled = false

    [shell.launcher]
    sort_by_usage = false

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true
    remember_last_region = true
    save_to_file = false
    show_cursor = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "destructive"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"
pure_black_dark = true

    [theme.templates]
    builtin_ids = [ "kitty", "umbriel", "starship" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition = []

    [wallpaper.default]
    path = "/home/r3p/Pictures/Wallpapers/porsche.png"

[backdrop]
enabled        = false
blur_intensity = 0.5
tint_intensity = 0.3

[widget.clock]
tooltip_format = "{:%A}\n{:%d-%m-%Y}"

[widget.media]
hide_album_art = true
hide_artist = true
hide_when_no_media = true
show_progress = true

[widget.notifications]
hide_when_no_unread = true

[widget.workspaces]
hide_when_empty = true
show_labels = false
active_pill_size = 1.5

[widget.privacy]
hide_inactive = true

[widget.tray]
drawer = true

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.battery]
hide_when_plugged = true
