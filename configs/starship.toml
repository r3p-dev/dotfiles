palette = "noctalia"

format = """
$username$hostname$directory$git_branch$git_status$cmd_duration
$character
"""

[username]
show_always = true
format = "[$user]($style)@"

[hostname]
ssh_only = false

[directory]
truncation_length = 1

[cmd_duration]
min_time = 500

[git_branch]

[git_status]

